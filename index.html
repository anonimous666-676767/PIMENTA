<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Mestre Orelha e a Caverna Proibida</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css"></head><body>
<canvas id="c"></canvas>
<div id="menu" class="panel">
<h1>MESTRE ORELHA<br><small>e a Caverna Proibida — 967 d.C.</small></h1>
<input id="nome" placeholder="Nome do herói" maxlength="12">
<select id="cls"><option value="K">Cavaleiro</option><option value="M">Mago</option><option value="S">Soldado de Tributos</option></select>
<label>Cor da skin <input id="col" type="color" value="#3a7bd5"></label>
<canvas id="prev" width="80" height="80"></canvas>
<button id="solo">JOGAR SOZINHO</button>
<button id="criar">CRIAR SALA</button>
<div><input id="cod" placeholder="Código da sala"><button id="entrar">ENTRAR</button></div>
<div id="lobby"></div><button id="start" hidden>INICIAR AVENTURA</button>
<p class="help">WASD move · Mouse mira · Clique/J ataca · Q ou 1 habilidade · R ou 2 esquiva/avanço · B compra poção (30) / melhora arma (E perto da loja) · P pausa</p>
</div>
<div id="hud" hidden></div><div id="dlg" hidden></div><div id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="multiplayer.js"></script><script src="game.js"></script>
</body></html>
